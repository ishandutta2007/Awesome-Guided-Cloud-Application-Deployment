<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }
    .g-bg-orb1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .g-bg-orb2 { animation: pulseGlow 8s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    .g-flow-line { stroke-dasharray: 8 8; animation: dashFlow 2s linear infinite; }
    .g-card-left { animation: floatCard1 5s ease-in-out infinite; }
    .g-card-right { animation: floatCard2 6s ease-in-out infinite 1s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/>
    <path d="M150 0 V400 M300 0 V400 M450 0 V400 M600 0 V400 M750 0 V400 M900 0 V400 M1050 0 V400"/>
  </g>

  <!-- Glowing Background Orbs -->
  <circle class="g-bg-orb1" cx="200" cy="100" r="140" fill="#38bdf8" fill-opacity="0.12" filter="url(#softGlow)" />
  <circle class="g-bg-orb2" cx="1000" cy="300" r="160" fill="#a855f7" fill-opacity="0.12" filter="url(#softGlow)" />

  <!-- Animated Connection Flows (Background Layer) -->
  <g fill="none" stroke-width="2">
    <path d="M 120 200 C 250 120, 350 280, 500 200" stroke="#38bdf8" stroke-opacity="0.4" class="g-flow-line"/>
    <path d="M 700 200 C 850 120, 950 280, 1080 200" stroke="#c084fc" stroke-opacity="0.4" class="g-flow-line"/>
  </g>

  <!-- Background Floating Tech Badges (Left Side) -->
  <g class="g-card-left">
    <rect x="50" y="80" width="130" height="38" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="115" y="104" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">☁️ AWS Cloud</text>
  </g>

  <g class="g-card-left">
    <rect x="70" y="270" width="130" height="38" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="135" y="294" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Coolify</text>
  </g>

  <!-- Background Floating Tech Badges (Right Side) -->
  <g class="g-card-right">
    <rect x="1000" y="90" width="130" height="38" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
    <text x="1065" y="114" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🐳 Dokku / K8s</text>
  </g>

  <g class="g-card-right">
    <rect x="980" y="275" width="140" height="38" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
    <text x="1050" y="299" fill="#a5f3fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🏗️ Terraform / IaC</text>
  </g>

  <!-- Main Content Foreground Card (Keeps Text Crisp and Unobscured) -->
  <rect x="220" y="70" width="760" height="260" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Foreground Title Header -->
  <text x="600" y="140" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="1">
    AWESOME GUIDED CLOUD DEPLOYMENT
  </text>

  <!-- Subtitle -->
  <text x="600" y="185" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="500" text-anchor="middle">
    Curated Directory of Commercial Deployment SaaS &amp; Open-Source PaaS Frameworks
  </text>

  <!-- Dynamic Accent Pills in Foreground Card -->
  <g stroke-width="1">
    <!-- Pill 1 -->
    <rect x="290" y="225" width="180" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="380" y="247" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Git-Push Workflows</text>

    <!-- Pill 2 -->
    <rect x="490" y="225" width="220" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="600" y="247" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Self-Hosted Alternatives</text>

    <!-- Pill 3 -->
    <rect x="730" y="225" width="180" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4"/>
    <text x="820" y="247" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">☁️ Infrastructure Automation</text>
  </g>

  <!-- Bottom Decorative Border Line -->
  <rect x="220" y="326" width="760" height="4" rx="2" fill="url(#textGrad)"/>
</svg>
